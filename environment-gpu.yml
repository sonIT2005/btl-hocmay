name: btl-histo
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch>=2.7
      - torchvision
      - timm>=1.0
      - pandas
      - pyyaml
      - scikit-learn
      - pillow
      - tqdm
      # Cho test và script dữ liệu (test_grouping, test_stain, tools/*), để một môi trường chạy được mọi test
      - opencv-python-headless
      - torchstain
      - imagehash
      - scipy
      - matplotlib
